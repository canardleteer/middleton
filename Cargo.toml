[package]
name = "middleton"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
git2 = "0.20"
opencode_rs = { version = "0.11.1", features = ["http", "sse", "server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
env_logger = "0.11"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

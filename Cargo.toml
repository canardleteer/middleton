[package]
name = "middleton"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["canardleteer"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# HTTPS/SSH cloning via libgit2 + OpenSSL; see [features] for vendored TLS.
git2 = "0.20"
opencode_rs = { version = "0.11.1", features = ["http", "sse", "server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
env_logger = "0.11"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
claude-codes = { version = "2.1", default-features = false, features = ["async-client"] }
uuid = { version = "1", features = ["v4"] }
codex-codes = { version = "0.129", default-features = false, features = ["async-client"] }

# git2 defaults to system libgit2/OpenSSL, which often fails when dev headers or
# versions mismatch. vendored-git bundles both for a self-contained build (still
# needs a C toolchain and perl). Disable with: cargo build --no-default-features
[features]
default = ["vendored-git"]
vendored-git = ["git2/vendored-libgit2", "git2/vendored-openssl"]

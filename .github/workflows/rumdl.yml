on:
  push:
    paths:
      - "**/*.md"
      - ".rumdl.toml"
      - ".github/workflows/rumdl.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".rumdl.toml"
      - ".github/workflows/rumdl.yml"
  workflow_dispatch:

name: "Markdown Hygiene"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rumdl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      # Pin the action and CLI independently; the action defaults to latest.
      # https://github.com/rvben/rumdl#cicd-integration
      - uses: rvben/rumdl@v0.2.62
        with:
          version: "0.2.62"
          config: .rumdl.toml

on:
  pull_request:
    paths:
      - "README.md"

name: "Markdown Hygiene"

jobs:
  rumdl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      # https://rumdl.dev/usage/ci-cd/ — pin both the action tag (@v0.2.2) and
      # `version` input; @v0 tracks the latest action release, not the rumdl binary.
      - uses: rvben/rumdl@v0.2.2
        with:
          config: .rumdl.toml
